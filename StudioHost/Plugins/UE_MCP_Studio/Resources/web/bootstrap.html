<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UE-MCP Studio</title>
<style>
  @font-face { font-family: "Plus Jakarta Sans"; src: url("fonts/PlusJakartaSans.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 100 800; font-display: swap; }
  @font-face { font-family: "Instrument Serif"; src: url("fonts/InstrumentSerif-Italic.woff2") format("woff2"); font-style: italic; font-weight: 400; font-display: swap; }
  :root {
    --bg: #0c0c0b; --panel: #131312; --panel-2: #1a1a18; --line: rgba(255, 255, 255, 0.07); --line-strong: rgba(255, 255, 255, 0.12);
    --text: #ece9e3; --muted: #b3b0a8; --dim: #7b7871; --accent: #e8720c; --accent-hi: #f28a2e; --ok: #6cc08b; --bad: #e5604f;
    --sans: "Plus Jakarta Sans", system-ui, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --serif: "Instrument Serif", Georgia, serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); font: 14px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
    background: radial-gradient(900px 420px at 50% -120px, rgba(232, 114, 12, 0.09), transparent 70%), var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  main { width: min(560px, 100%); padding: 32px 20px; }
  .brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 28px; }
  .brand .mark { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px rgba(232, 114, 12, 0.6); align-self: center; }
  .brand .name { font: 700 14px/1 var(--mono); }
  .brand .product { font: italic 400 20px/1 var(--serif); color: var(--accent); }
  h1 { font: 700 34px/1.1 var(--sans); letter-spacing: -0.03em; margin: 0 0 8px; }
  h1 em { font: italic 400 42px/1 var(--serif); color: var(--accent); letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin: 0 0 26px; }
  .steps { display: flex; gap: 6px; margin: 0 0 14px; padding: 0; list-style: none; }
  .steps li {
    flex: 1; display: flex; align-items: center; gap: 7px; padding-top: 10px; border-top: 2px solid var(--line-strong);
    font: 500 10.5px/1.3 var(--mono); text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim);
  }
  .steps li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
  .steps li.done { color: var(--muted); border-top-color: rgba(108, 192, 139, 0.5); }
  .steps li.done::before { background: var(--ok); }
  .steps li.now { color: var(--text); border-top-color: var(--accent); }
  .steps li.now::before { background: var(--accent); box-shadow: 0 0 8px rgba(232, 114, 12, 0.7); animation: pulse 1.4s ease-in-out infinite; }
  .card {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 120px), var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; box-shadow: 0 24px 48px -28px rgba(0, 0, 0, 0.7);
  }
  .card p { margin: 0 0 8px; }
  .card strong { font-size: 16px; letter-spacing: -0.01em; }
  .muted { color: var(--muted); }
  .note { color: var(--dim); font-size: 12px; margin-top: 14px !important; }
  .mono { font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  button {
    background: var(--accent); color: #140a02; border: 1px solid var(--accent); border-radius: 6px; padding: 9px 18px;
    font: 600 12px/1.2 var(--mono); letter-spacing: 0.02em; cursor: pointer; transition: background 0.15s, border-color 0.15s;
  }
  button:hover:not(:disabled) { background: var(--accent-hi); border-color: var(--accent-hi); }
  button.secondary { background: var(--panel-2); color: var(--text); border-color: var(--line-strong); font-weight: 500; }
  button.secondary:hover:not(:disabled) { background: #222220; border-color: rgba(232, 114, 12, 0.35); }
  button:disabled { opacity: 0.45; cursor: default; }
  .spinner {
    display: inline-block; width: 12px; height: 12px; margin-right: 9px; vertical-align: -1px;
    border: 2px solid rgba(232, 114, 12, 0.25); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  .error { color: var(--bad); }
  .options { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .options .summary { display: flex; align-items: baseline; gap: 10px; color: var(--muted); font-size: 13px; }
  .options .summary span { flex: 1; }
  .link { background: none; border: 0; padding: 0; color: var(--accent-hi); font: 500 12px/1.4 var(--mono); }
  .link:hover:not(:disabled) { background: none; text-decoration: underline; }
  .choices { margin-top: 12px; display: none; }
  .choices.open { display: block; }
  .choices h3 { font: 600 10.5px/1.3 var(--mono); text-transform: uppercase; letter-spacing: 0.14em; color: var(--dim); margin: 12px 0 6px; }
  .choices label { display: flex; align-items: center; gap: 9px; padding: 4px 0; color: var(--text); cursor: pointer; }
  .choices label small { color: var(--dim); font-size: 12px; }
  .choices input { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="mark"></span><span class="name">ue-mcp</span><span class="product">Studio</span></div>
  <h1>Getting this project <em>ready</em>.</h1>
  <p class="lede">Studio sets up its MCP server in this editor once.</p>
  <ol class="steps" id="steps"><li>Dependencies</li><li>Bridge</li><li>MCP server</li></ol>
  <div class="card" id="step"><p class="muted"><span class="spinner"></span>Checking</p></div>
</main>
<script>
  // The editor binds window.ue.studio. Opened outside the editor there is nothing to drive.
  var studio = window.ue && window.ue.studio;
  var step = document.getElementById("step");
  var stepItems = document.getElementById("steps").children;
  var spin = '<span class="spinner"></span>';
  var waiting = null;
  // When Install started (ms); until the bridge lands on disk, keep showing progress.
  var installing = 0;

  // Steps before `stage` show as done and `stage` as current; no stage clears the strip.
  function render(html, stage) {
    step.innerHTML = html;
    for (var i = 0; i < stepItems.length; i++) {
      stepItems[i].className = stage === undefined ? "" : i < stage ? "done" : i === stage ? "now" : "";
    }
  }

  function call(name, arg) {
    if (!studio) return Promise.resolve(null);
    return arg === undefined ? studio[name]() : studio[name](arg);
  }

  function check() {
    if (!studio) {
      render('<p>This page runs inside the editor. In a browser, open the URL from <span class="mono">npx ue-mcp daemon open</span>.</p>');
      return;
    }
    call("getstatus").then(function (raw) {
      var s = JSON.parse(raw);
      if (!s.node) {
        render('<p><strong>Install dependencies</strong></p>' +
          '<p class="muted">The MCP server needs a runtime that is not on this machine yet. Download the recommended installer, run it, then check again.</p>' +
          '<div class="actions"><button id="dl">Download</button><button class="secondary" id="again">Check again</button></div>', 0);
        document.getElementById("dl").onclick = function () { call("opennodedownload"); };
        document.getElementById("again").onclick = check;
      } else if (!s.bridgeInstalled && s.bridgeOnDisk === "source") {
        render('<p><strong>Restart to build the bridge</strong></p>' +
          '<p class="muted">The bridge was installed from source, so the editor builds it on the next start.</p>' +
          '<div class="actions"><button id="restart">Restart editor</button></div>', 1);
        document.getElementById("restart").onclick = function () { call("restarteditor"); };
      } else if (!s.bridgeInstalled && s.bridgeOnDisk === "binary" && s.bridgeNeedsRestart) {
        render('<p><strong>Restart to load the bridge</strong></p>' +
          '<p class="muted">The bridge is installed. It needs engine plugins that load only when the editor starts.</p>' +
          '<div class="actions"><button id="restart">Restart editor</button></div>', 1);
        document.getElementById("restart").onclick = function () { call("restarteditor"); };
      } else if (!s.bridgeInstalled && s.bridgeOnDisk === "binary") {
        render('<p><strong>' + spin + 'Loading the bridge</strong></p><p class="muted">No restart needed.</p>', 1);
        schedule();
      } else if (!s.bridgeInstalled && installing && Date.now() - installing > 5 * 60 * 1000) {
        installing = 0;
        render('<p class="error">The bridge did not install. See <span class="mono">' + s.log + '</span>.</p>' +
          '<div class="actions"><button id="again">Try again</button></div>', 1);
        document.getElementById("again").onclick = check;
      } else if (!s.bridgeInstalled && installing) {
        render('<p><strong>' + spin + 'Installing the bridge</strong></p><p class="muted">This takes a minute.</p>' +
          '<p class="note">Progress is written to <span class="mono">' + s.log + '</span></p>', 1);
        schedule();
      } else if (!s.bridgeInstalled) {
        render('<p><strong>Install the ue-mcp bridge</strong></p>' +
          '<p class="muted">The bridge plugin lets the MCP server work in this editor. Installing it takes a minute, then the editor restarts once.</p>' +
          '<div class="actions"><button id="install">Install</button></div>' +
          '<div class="options"><div class="summary"><span id="summary">' + spin + 'Reading setup options</span>' +
          '<button class="link" id="toggle" disabled>Options</button></div><div class="choices" id="choices"></div></div>' +
          '<p class="note">Progress is written to <span class="mono">' + s.log + '</span></p>', 1);
        loadPlan();
        document.getElementById("toggle").onclick = function () {
          var open = document.getElementById("choices").classList.toggle("open");
          this.textContent = open ? "Hide options" : "Options";
        };
        document.getElementById("install").onclick = function () {
          this.disabled = true;
          var options = chosenOptions();
          (options ? call("runsetup", JSON.stringify(options)) : call("installbridge")).then(function (ok) {
            if (!ok) {
              render('<p class="error">The install could not start. See <span class="mono">' + s.log + '</span>.</p>', 1);
              return;
            }
            installing = Date.now();
            check();
          });
        };
      } else if (!s.daemon) {
        render('<p><strong>' + spin + (s.studioVersion ? 'Starting the MCP server' : 'Downloading Studio') + '</strong></p>' +
          '<p class="muted">This takes a few seconds the first time.</p>' +
          '<div class="actions"><button class="secondary" id="start">Start again</button></div>', 2);
        document.getElementById("start").onclick = function () { call("startdaemon"); };
        schedule();
      } else {
        render('<p><strong>' + spin + 'Connecting to the MCP server</strong></p>', 2);
        schedule();
      }
    });
  }

  // The setup plan: init's dry run, read in the background while the Install card shows.
  var plan = null;
  var planStarted = 0;

  function esc(t) {
    return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }

  function loadPlan() {
    if (plan) return showPlan();
    if (!planStarted) {
      planStarted = Date.now();
      call("startsetupplan");
    }
    call("getsetupplan").then(function (raw) {
      var parsed = null;
      try { parsed = raw ? JSON.parse(raw) : null; } catch (e) { parsed = null; }
      if (parsed && parsed.plan) {
        plan = parsed.plan;
        showPlan();
      } else if (Date.now() - planStarted > 90 * 1000) {
        // No plan: Install keeps init's defaults.
        var summary = document.getElementById("summary");
        if (summary) summary.textContent = "Installs with the default options.";
      } else {
        setTimeout(loadPlan, 1000);
      }
    });
  }

  function engineAtLeast(v, major, minor) {
    var m = /^(\d+)\.(\d+)/.exec(v || "");
    return !!m && (+m[1] > major || (+m[1] === major && +m[2] >= minor));
  }

  function showPlan() {
    var summary = document.getElementById("summary");
    var choices = document.getElementById("choices");
    if (!summary || !choices) return;
    var clients = plan.clients.filter(function (c) { return c.detected; });
    var native = engineAtLeast(plan.project.engine, 5, 8);
    var html = "<h3>Also connect these MCP clients</h3>";
    if (clients.length === 0) html += '<p class="note" style="margin-top:0 !important">No other MCP clients found on this machine.</p>';
    clients.forEach(function (c) {
      // A global client's config applies to every project, so it is never chosen for the user.
      var on = c.selected && c.projectScoped;
      html += '<label><input type="checkbox" data-client="' + esc(c.id) + '"' + (on ? " checked" : "") + "> " + esc(c.name) +
        (c.projectScoped ? "" : " <small>applies to every project</small>") + "</label>";
    });
    if (native) {
      html += "<h3>Tools</h3><label><input type=\"checkbox\" id=\"native\"" + (plan.nativeTools.enabled ? " checked" : "") + "> Native Unreal tools <small>Epic's own MCP tools, alongside the bridge</small></label>";
    }
    choices.innerHTML = html;
    choices.onchange = summarize;
    document.getElementById("toggle").disabled = false;
    summarize();
  }

  function chosenOptions() {
    if (!plan) return null;
    var boxes = document.querySelectorAll("#choices input[data-client]");
    var clients = [];
    for (var i = 0; i < boxes.length; i++) if (boxes[i].checked) clients.push(boxes[i].getAttribute("data-client"));
    var native = document.getElementById("native");
    return {
      clients: clients,
      nativeTools: native ? native.checked : plan.nativeTools.enabled,
      context: plan.contextStrategy,
      feedback: plan.feedback,
      skills: plan.skills,
    };
  }

  function summarize() {
    var o = chosenOptions();
    var names = plan.clients.filter(function (c) { return o.clients.indexOf(c.id) >= 0; }).map(function (c) { return c.name; });
    var text = names.length ? "Also connects " + names.join(", ") + "." : "Connects no other MCP clients.";
    if (document.getElementById("native")) text += o.nativeTools ? " Native Unreal tools on." : " Native Unreal tools off.";
    document.getElementById("summary").textContent = text;
  }

  // While waiting on the daemon, keep checking; the panel switches to the UI when it is up.
  function schedule() {
    if (waiting) clearTimeout(waiting);
    waiting = setTimeout(check, 2000);
  }

  check();
</script>
</body>
</html>
